spring.application.name=multicam-server
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/multicam?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON dùng snake_case theo đề (first_name, account_role, verify_required...)
spring.jackson.property-naming-strategy=SNAKE_CASE
# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
app.jwt.access-ttl-seconds=3600
app.jwt.refresh-ttl-days=30
# Tài khoản Controller duy nhất (cấp sẵn).
app.controller.email=controller@example.com
app.controller.phone=0900000000
app.controller.password=${CONTROLLER_PASSWORD:Controller123}