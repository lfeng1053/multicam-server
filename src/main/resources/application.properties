spring.application.name=multicam-server
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/multicam?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON dùng snake_case theo đề (first_name, account_role, verify_required...)
spring.jackson.property-naming-strategy=SNAKE_CASE